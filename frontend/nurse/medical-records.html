<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Medical Records - ULS Clinic System</title>
    <script src="../js/login-theme.js"></script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/ui.js" defer></script>
    <script src="../js/role-nav.js" defer></script>
    <script src="../js/medical-records.js" defer></script>
</head>

<body>
    <header class="topbar">
        <h1>ULS Clinic Management System <span>Prototype v5 (HTML/CSS)</span></h1>
        <nav aria-label="Account"><a href="../index.html" data-logout>Log out</a></nav>
    </header>
    <div class="layout">
        <aside>
            <nav aria-label="Menu">
                <h4>Nurse</h4><a href="../nurse/assess.html">Assess</a><a href="../doctor/statistics.html">Statistics</a>
            </nav>
        </aside>
        <main>
            <div class="page-head">
                <div>
                    <h2>Medical Records <span class="pill neutral readonly-tag" id="readonly-tag" hidden>Read-only</span> <span class="pill yellow" id="sample-tag">Sample data, nothing here is saved</span></h2>
                    <p class="sub">Search a student, open the record, then add an entry from there.</p>
                </div>
                <a class="btn" id="add-student" href="../nurse/add-student.html">+ Add student</a>
            </div>
            <div class="filters" role="search">
                <div class="grow"><label for="mr-search">Search by name or ID</label><input id="mr-search" type="search"
                        placeholder="Type a name or ID number" autocomplete="off"></div>
                <div class="filters-clear"><button type="button" class="btn sec" id="mr-clear">Clear</button></div>
            </div>
            <nav class="tabs" id="mr-tabs" aria-label="Department"></nav>
            <p class="filter-count" id="mr-count" role="status" aria-live="polite"></p>
            <section class="box">
                <table class="record-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Department</th>
                            <th>Age</th>
                            <th>Last visit</th>
                            <th aria-label="Open"></th>
                        </tr>
                    </thead>
                    <tbody id="mr-body">
                        <tr>
                            <td colspan="6">Loading students...</td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>
</body>

</html>
