<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login - ULS Clinic System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <script src="js/login-theme.js"></script>
    <script src="js/ui.js" defer></script>
    <script src="js/clinic-api.js" defer></script>
    <script src="js/staff-login.js" defer></script>
</head>
<body class="login-page">
    <main class="login">
        <div class="login-tools">
            <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle light mode" aria-pressed="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
                <span>Dark mode</span>
            </button>
            <svg class="clinic-mark" viewBox="110 330 850 410" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="M166 382c-18 13-33 24-24 47 13 31 60 64 98 98 24 22 39 27 56 15 20-13 10-36 0-61-16-42-29-91-50-116-20-25-37-14-58-1"/>
                <path d="M238 521c22 17 48-4 55-25" stroke-width="7"/>
                <path d="M293 541c57 48 129 61 187 37 53-22 117-75 95-125-15-36-57-42-87-17-32-27-74-17-87 15-21 52 38 105 79 130 33 22 68 34 97 21l28 61 15-107 20 51h43l41-181 32 289 26-159 20 75 13-43h77"/>
                <circle cx="915" cy="587" r="23"/>
                <circle cx="915" cy="587" r="10" fill="currentColor" stroke="none"/>
            </svg>
        </div>
        <p class="eyebrow">UNIVERSITY HEALTH SERVICES</p>
        <h2>Welcome to ULS Clinic</h2>
        <p class="login-intro">Your campus care, all in one place.</p>
        <form class="f" id="staff-login">
            <label for="u">ID number</label>
            <input id="u" name="username" autocomplete="username" placeholder="Staff ID or username" required>
            <label for="p">Password</label>
            <input id="p" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
            <p class="alert" id="login-message" role="alert" hidden></p>
            <button class="btn" type="submit">Sign in to Staff Portal</button>
        </form>
        <p class="role-label">Continue to your clinic portal</p>
        <div class="login-portals">
        <a class="btn" href="doctor-dashboard.html">Enter as Doctor</a>
        <a class="btn sec" href="nurse-dashboard.html">Enter as Nurse</a>
        <a class="btn sec" href="student-dashboard.html">Enter as Student</a>
        <a class="btn sec" href="employee-dashboard.html">Enter as Employee</a>
        </div>
        <p class="note">Doctor and nurse portals require your staff account. Student and employee portals contain sample data.</p>
    </main>
</body>
</html>
